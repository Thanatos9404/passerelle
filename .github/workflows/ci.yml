name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra eval --group dev
      - name: Unit + contract tests (mock LLM)
        run: uv run pytest -q
      - name: Lockfile is in sync
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o /tmp/req.lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/req.lock)

  docker:
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: track_2b
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile local-llm config -q
          docker compose --profile local-llm-gpu config -q
      - name: Build image (same as `make run`)
        run: docker compose build
      - name: Start app + mock LLM via compose
        env:
          LLM_BASE_URL: http://mockllm:8099/v1
          LLM_NAME: mock-apertus
          LLM_API_KEY: ci
        run: |
          docker compose -f docker-compose.yml -f ci/compose.mock.yml up -d
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
          docker compose ps
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8080
      - name: Container runs as non-root and is healthy
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"
          for i in $(seq 1 30); do s=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q app)); [ "$s" = healthy ] && break; sleep 3; done
          echo "health: $s"; test "$s" = healthy
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f ci/compose.mock.yml logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f ci/compose.mock.yml down -v
